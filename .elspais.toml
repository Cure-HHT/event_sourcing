# Requirement-status semantics
#
# Default elspais behaviour treats `Draft` as `provisional` (excluded
# from coverage tallies). Much of the spec set is in Draft, and the
# coverage metrics count the Draft surface so authoring progress is
# visible.
#
# Move `Draft` into `active`. `Proposed` stays provisional (genuinely
# tentative requirements still excluded). Aspirational and retired
# semantics unchanged.

[rules.format.status_roles]
active = ["Active", "Draft"]
provisional = ["Proposed"]
aspirational = ["Roadmap", "Future", "Idea"]
retired = ["Deprecated", "Superseded", "Rejected"]

# Structural-orphan suppression.
#
# A "structural orphan" is a node with no FILE ancestor. The flutter-machine
# reporter emits one RESULT node per executed test case with no stable
# `test_id`, so elspais cannot wire those nodes to a TEST/FILE by edge -- it
# instead credits `verified` by matching the RESULT's `source_file` to the test
# file's path. The result nodes are therefore structurally orphaned by design,
# not by a build bug. Once `results` persists to disk (above), every `checks`
# run loads them, so the default `spec.structural_orphans` check would fail the
# pre-push hook (`elspais checks --lenient`) on ~1 orphan-per-test-case even
# though nothing is wrong. Suppress it.
# Reference and format severities
#
# The keys left at their default are named rather than omitted, so the levers
# available here are visible in the file. keyword_form, identifier_form,
# no_assertions and no_traceability all read clean today and are held at error
# so a regression is a failure rather than a line of output nobody reads.

[rules.references]
retired = "warning"
provisional = "info"
aspirational = "info"
malformed = "warning"
keyword_form = "error"
identifier_form = "error"

[rules.format]
no_assertions_severity = "error"
no_traceability_severity = "error"

[rules.hierarchy]
allow_structural_orphans = true

# Cross-repo federation scope
#
# Read operations always federate; these flags gate only the write and generate
# surfaces. With both false, `elspais fix` and the MCP mutations modify this
# repo's spec files alone, and never fold an associate's requirements into this
# repo's INDEX. Associate links are machine-local, so a developer who links one
# to resolve a cross-repo reference cannot rewrite the linked repo by running
# a fix here.
[federation]
write_associates = false
index_associates = false
