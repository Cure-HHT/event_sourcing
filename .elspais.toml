# elspais configuration — Cure-HHT Event Sourcing Library
#
# Defines the formal-requirement ID format, level hierarchy, and file
# scanning surface for this repo. Authored by hand (not generated by
# `elspais init`) to use the EVS namespace with named (not numeric)
# component IDs.
#
# Companion: spec/requirements-spec.md (canonical grammar).

# Schema version (do not change without consulting elspais docs)
version = 4

# Daemon TTL in minutes (>0 = auto-start, 0 = disabled, <0 = no timeout)
cli_ttl = 30
# File path for MCP tool-usage statistics (optional)
stats = ""

# Project identity

[project]
namespace = "EVS"
name = "Cure-HHT Event Sourcing Library"

# Requirement ID format
#
# Canonical form: EVS-{level}-{component}[/{assertion}]
#   level     — three-letter audience tag (`prd` or `dev`)
#   component — kebab-case noun describing the requirement subject
#   assertion — optional A–Z label (or A/B/C... multi-assertion)
#
# Examples:
#   EVS-PRD-event-log
#   EVS-DEV-provenance-entry-schema/G
#   EVS-OPS-secret-rotation

[id-patterns]
canonical = "{namespace}-{level.letter}-{component}"
separators = ["-"]
prefix_optional = false

[id-patterns.aliases]
short = "{level.letter}-{component}"

[id-patterns.component]
# `kebab-case` = lowercase kebab-case component names (e.g. `library-charter`).
# Built-in style; the regex is fixed and unambiguous against uppercase
# assertion labels (`/A`, `/A/B/C`).
style = "kebab-case"
max_length = 64

[id-patterns.assertions]
label_style = "uppercase"
max_count = 26
separator = "/"
multi_separator = "/"
zero_pad = false

[id-patterns.associated]
enabled = false
position = "after_prefix"
format = "uppercase"
length = 3
separator = "-"

# Requirement-level definitions
#
# Three levels: PRD (product obligations), OPS (operational
# obligations — release management, deployment of derived artifacts,
# secret rotation, etc.), and DEV (implementation obligations).

[levels.PRD]
rank = 1
letter = "PRD"
display_name = "Product"
implements = ["PRD"]

[levels.OPS]
rank = 2
letter = "OPS"
display_name = "Operations"
implements = ["OPS", "PRD"]

[levels.DEV]
rank = 3
letter = "DEV"
display_name = "Development"
implements = ["DEV", "OPS", "PRD"]

# File scanning configuration

[scanning]
skip = ["node_modules", ".git", "__pycache__", "*.pyc", ".venv", ".env", ".dart_tool", "build", ".flutter-plugins", ".flutter-plugins-dependencies"]

[scanning.spec]
directories = ["spec"]
file_patterns = ["*.md"]
# Authoring infrastructure files, not normative requirements.
skip_files = ["README.md", "requirements-spec.md", "INDEX.md", "EXAMPLE-requirement.md"]

[scanning.code]
directories = [
  "event_sourcing/lib",
  "canonical_json_jcs/lib",
  "provenance/lib",
  "reaction/lib",
  "reaction_widgets/lib",
  "reaction_widgets_testing/lib",
]
file_patterns = []
skip_files = []
skip_dirs = []

[scanning.test]
directories = [
  "event_sourcing/test",
  "event_sourcing/example_action_permissions/test",
  "event_sourcing/example/test",
  "canonical_json_jcs/test",
  "provenance/test",
  "reaction/test",
  "reaction_widgets/test",
  "reaction_widgets_testing/test",
]
file_patterns = ["*_test.dart", "test_*.dart"]
skip_files = []
skip_dirs = []
enabled = true
prescan_command = ""
reference_keyword = "Verifies"
reference_patterns = []

# CUR-1533 test targets: one per Flutter package. Each runs `flutter test
# --machine` (native JSON on stdout, real `suite.path` per test file) and reads
# the package's `coverage/lcov.info`. `match = "source"` wires file-granular
# RESULT->TEST verification by real path (no tojunit, no gen-junit script).
# `credit_coverage = "verified"` credits the lcov_tested dimension from covered
# // Implements: lines. `elspais checks --run-tests` runs these; CI omits
# `command` and points at pre-produced coverage/results.
#
# CUR-1556: each command also writes the same machine JSON to a file via
# `--file-reporter=json:coverage/machine.jsonl`, and `results` points at it
# (path/name matched to hht_diary's CUR-1556 targets for cross-repo
# consistency). The `flutter-machine` reporter is a stdout channel, so
# `--run-tests` ingests results transiently from captured stdout -- but commands
# that do NOT run the tests (`elspais trace`, `viewer`, `graph`) have no captured
# stdout and fall back to globbing `results`. Without a persisted file they
# skipped result ingestion entirely, so `verified` (and the viewer's VER links)
# showed 0 even though tests passed. Persisting to `coverage/` (gitignored,
# alongside lcov.info) makes the verified dimension survive outside a
# `--run-tests` invocation. The `--file-reporter` sink is additive: stdout still
# carries the machine JSON, so `--run-tests` capture and the real exit code are
# unaffected. NOTE: the daemon only watches spec/code/test dirs, not coverage/ or
# this config -- run `elspais daemon --force` after producing results so the
# viewer rebuilds. Because results now persist, every `checks` run (not just
# `--run-tests`) loads the per-test-case RESULT nodes; flutter-machine emits no
# stable test_id, so those nodes have no FILE ancestor and trip
# `spec.structural_orphans`. That is inherent to path-based (not edge-based)
# result matching and benign for verification, so `[rules.hierarchy]
# allow_structural_orphans` below suppresses it (as hht_diary already does).
#
# flutter is not on elspais's PATH in the dev env; run with:
#   PATH="$HOME/flutter-sdk/flutter/bin:$PATH" elspais checks --run-tests
# Postgres-backed packages (event_sourcing, example_action_permissions) share a
# single DB across multiple test files; `flutter test` runs files in parallel by
# default, so they race on schema setup. Force `--concurrency=1` for them.

[[scanning.test.targets]]
name = "provenance"
cwd = "provenance"
command = "flutter test --machine --coverage --file-reporter=json:coverage/machine.jsonl"
reporter = "flutter-machine"
results = "coverage/machine.jsonl"
coverage = "coverage/lcov.info"
match = "source"
credit_coverage = "verified"

[[scanning.test.targets]]
name = "reaction"
cwd = "reaction"
command = "flutter test --machine --coverage --file-reporter=json:coverage/machine.jsonl"
reporter = "flutter-machine"
results = "coverage/machine.jsonl"
coverage = "coverage/lcov.info"
match = "source"
credit_coverage = "verified"

[[scanning.test.targets]]
name = "reaction_widgets_testing"
cwd = "reaction_widgets_testing"
command = "flutter test --machine --coverage --file-reporter=json:coverage/machine.jsonl"
reporter = "flutter-machine"
results = "coverage/machine.jsonl"
coverage = "coverage/lcov.info"
match = "source"
credit_coverage = "verified"

[[scanning.test.targets]]
name = "reaction_widgets"
cwd = "reaction_widgets"
command = "flutter test --machine --coverage --file-reporter=json:coverage/machine.jsonl"
reporter = "flutter-machine"
results = "coverage/machine.jsonl"
coverage = "coverage/lcov.info"
match = "source"
credit_coverage = "verified"

[[scanning.test.targets]]
name = "canonical_json_jcs"
cwd = "canonical_json_jcs"
command = "flutter test --machine --coverage --file-reporter=json:coverage/machine.jsonl"
reporter = "flutter-machine"
results = "coverage/machine.jsonl"
coverage = "coverage/lcov.info"
match = "source"
credit_coverage = "verified"

[[scanning.test.targets]]
name = "event_sourcing/example"
cwd = "event_sourcing/example"
command = "flutter test --machine --coverage --file-reporter=json:coverage/machine.jsonl"
reporter = "flutter-machine"
results = "coverage/machine.jsonl"
coverage = "coverage/lcov.info"
match = "source"
credit_coverage = "verified"

[[scanning.test.targets]]
name = "event_sourcing"
cwd = "event_sourcing"
command = "flutter test --machine --coverage --concurrency=1 --file-reporter=json:coverage/machine.jsonl"
reporter = "flutter-machine"
results = "coverage/machine.jsonl"
coverage = "coverage/lcov.info"
match = "source"
credit_coverage = "verified"

[[scanning.test.targets]]
name = "event_sourcing/example_action_permissions"
cwd = "event_sourcing/example_action_permissions"
command = "flutter test --machine --coverage --concurrency=1 --file-reporter=json:coverage/machine.jsonl"
reporter = "flutter-machine"
results = "coverage/machine.jsonl"
coverage = "coverage/lcov.info"
match = "source"
credit_coverage = "verified"

[scanning.docs]
directories = ["docs"]
file_patterns = ["*.md"]

# Requirement-status semantics
#
# Default elspais behaviour treats `Draft` as `provisional` (excluded
# from coverage tallies). For CUR-1317 the whole spec set is still in
# Draft — promoting requirements to Active is part of the post-Phase-I
# stabilization pass, not yet done. Until then we want coverage metrics
# to reflect the Draft surface so authoring progress is visible.
#
# Move `Draft` into `active`. `Proposed` stays provisional (genuinely
# tentative requirements still excluded). Aspirational and retired
# semantics unchanged.

[rules.format.status_roles]
active = ["Active", "Draft"]
provisional = ["Proposed"]
aspirational = ["Roadmap", "Future", "Idea"]
retired = ["Deprecated", "Superseded", "Rejected"]

# Structural-orphan suppression (CUR-1556).
#
# A "structural orphan" is a node with no FILE ancestor. The flutter-machine
# reporter emits one RESULT node per executed test case with no stable
# `test_id`, so elspais cannot wire those nodes to a TEST/FILE by edge -- it
# instead credits `verified` by matching the RESULT's `source_file` to the test
# file's path. The result nodes are therefore structurally orphaned by design,
# not by a build bug. Once `results` persists to disk (above), every `checks`
# run loads them, so the default `spec.structural_orphans` check would fail the
# pre-push hook (`elspais checks --lenient`) on ~1 orphan-per-test-case even
# though nothing is wrong. Suppress it -- matching hht_diary's CUR-1556 config.
[rules.hierarchy]
allow_structural_orphans = true
