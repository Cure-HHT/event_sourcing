# elspais configuration — Cure-HHT Event Sourcing Library
#
# Defines the formal-requirement ID format, level hierarchy, and file
# scanning surface for this repo. Authored by hand (not generated by
# `elspais init`) to use the EVS namespace with named (not numeric)
# component IDs.
#
# Companion: spec/requirements-spec.md (canonical grammar).

# Schema version (do not change without consulting elspais docs)
version = 5

# Daemon TTL in minutes (>0 = auto-start, 0 = disabled, <0 = no timeout)
cli_ttl = 30
# File path for MCP tool-usage statistics (optional)
stats = ""

# Project identity

[project]
namespace = "EVS"
name = "Cure-HHT Event Sourcing Library"

# Requirement ID format
#
# Canonical form: EVS-{level}-{component}[/{assertion}]
#   level     — three-letter audience tag (`prd` or `dev`)
#   component — kebab-case noun describing the requirement subject
#   assertion — optional A–Z label (or A+B+C... multi-assertion)
#
# Examples:
#   EVS-PRD-event-log
#   EVS-DEV-provenance-entry-schema/G
#   EVS-OPS-secret-rotation

[id-patterns]
canonical = "{namespace}-{level.letter}-{component}"

[id-patterns.aliases]
short = "{level.letter}-{component}"

[id-patterns.component]
# `kebab-case` = lowercase kebab-case component names (e.g. `library-charter`).
# Built-in style; the regex is fixed and unambiguous against uppercase
# assertion labels (`/A`, `/A+B+C`).
style = "kebab-case"

[id-patterns.assertions]
label_style = "uppercase"
max_count = 26
separator = "/"
multi_separator = "+"
zero_pad = false

[id-patterns.associated]
enabled = false
position = "after_prefix"
format = "uppercase"
length = 3
separator = "-"

# Requirement-level definitions
#
# Three levels: PRD (product obligations), OPS (operational
# obligations — release management, deployment of derived artifacts,
# secret rotation, etc.), and DEV (implementation obligations).

[levels.PRD]
rank = 1
letter = "PRD"
display_name = "Product"
implements = ["PRD"]

[levels.OPS]
rank = 2
letter = "OPS"
display_name = "Operations"
implements = ["OPS", "PRD"]

[levels.DEV]
rank = 3
letter = "DEV"
display_name = "Development"
implements = ["DEV", "OPS", "PRD"]

# File scanning configuration

[scanning]
# Paths no scan reads, and that are not a test target's inputs. A target's
# inputs are every other file in the working tree, ignored or not, so this list
# holds everything .gitignore does: what a build, `flutter pub get`, a test run
# or tools/run-checks.sh writes, and local working files. An unlisted one makes
# a result read as stale -- on the machine that wrote it during the run, and on
# every machine that lacks it, such as CI's gate job, which builds nothing. A
# directory entry is a path from the repository root, so one that occurs in
# each package is written `**/<name>`; a file entry is a bare file name.
skip = [
  # Repository and tool state
  ".git", ".elspais", ".venv", ".check-logs", ".superpowers", "docs/superpowers",
  ".idea", ".history", ".atom", ".buildlog", ".vscode",
  # Build and dependency output
  "**/node_modules", "**/__pycache__", "**/.dart_tool", "**/build", "**/coverage", "**/doc/api",
  "**/linux/flutter/ephemeral", "**/macos/Flutter/ephemeral", "**/windows/flutter/ephemeral",
  "**/android/.gradle",
  # Files
  "*.pyc", ".env", ".DS_Store", "*.iml", "*.swp", ".check-durations",
  ".flutter-plugins", ".flutter-plugins-dependencies", "pubspec.lock", "pubspec_overrides.yaml",
  "generated_plugin_registrant.cc", "generated_plugin_registrant.h", "generated_plugins.cmake",
  "GeneratedPluginRegistrant.swift", "GeneratedPluginRegistrant.h", "GeneratedPluginRegistrant.m",
  "Generated.xcconfig", "Flutter.podspec", "local.properties",
  "elspais-refines-coverage-propagation-repro.md", "checks--*.json",
  "traceability.html", "traceability.md", "traceability.csv", "traceability_view.html",
  "traceability_matrix.csv", "traceability_matrix.html", "traceability_matrix.md",
]

[scanning.spec]
directories = ["spec"]
file_patterns = ["*.md"]
# Authoring infrastructure files, not normative requirements.
skip_files = ["README.md", "requirements-spec.md", "INDEX.md", "EXAMPLE-requirement.md"]

[scanning.code]
directories = [
  "event_sourcing/lib",
  "canonical_json_jcs/lib",
  "provenance/lib",
  "reaction/lib",
  "reaction_widgets/lib",
  "reaction_widgets_testing/lib",
]
file_patterns = []
skip_files = []
skip_dirs = []

[scanning.test]
directories = [
  "event_sourcing/test",
  "event_sourcing/example_action_permissions/test",
  "event_sourcing/example/test",
  "event_sourcing/example/integration_test",
  "event_sourcing/example_clinical_scopes/test",
  "canonical_json_jcs/test",
  "provenance/test",
  "reaction/test",
  "reaction/example/test",
  "reaction_widgets/test",
  "reaction_widgets_testing/test",
]
file_patterns = ["*_test.dart", "test_*.dart", "*_conformance.dart"]
skip_files = []
skip_dirs = []
enabled = true
# Each target writes its results and coverage into <output_root>/<name>/,
# whose absolute path its command reads from $ELSPAIS_TARGET_OUTPUT.
output_root = ".results"
prescan_command = ""
reference_keyword = "Verifies"
reference_patterns = []

# Test targets: the single definition of the repository's test suites. The
# root Makefile (through tools/run-checks.sh) and CI
# (.github/workflows/event-sourcing-tests.yml) both run them through
# `elspais checks --run-tests --targets <group or target>`; neither lists a
# suite or a test command of its own.
#
# Each target runs `flutter test` with the machine reporter
# (`reporter = "flutter-machine"`, `match = "source"`): the JSON carries each
# test's real `suite.path` and line, so a result binds to the test that
# produced it. `credit_coverage = "verified"` credits the lcov_tested dimension
# from covered // Implements: lines, and a red target marks that credit
# failing.
#
# flutter-machine is a stdout channel: under `--run-tests` elspais parses the
# command's captured stdout, not the `results` files. Each command therefore
# prints the machine JSON on stdout and also writes it, with its lcov, into the
# target's own folder, .results/<name>/, whose absolute path elspais passes in
# ELSPAIS_TARGET_OUTPUT; `results` and `coverage` are paths inside that folder.
# Every command that does not run the tests (a plain `elspais checks`,
# `trace`, `viewer`, and CI's gate job over the downloaded artifacts) reads
# them there. No two targets share a folder, so any set of targets can run at
# once. The folder also holds the fingerprint of the inputs the run saw, so a
# result reads as stale once an input changes; the global `skip` above keeps
# what runs and builds write out of those inputs.
#
# Commands run with --no-pub (resolve dependencies first: `make` and CI do),
# and in each package at most one target builds the test assets (the widget
# tests of the example packages load the framework's shaders from them); the
# others pass --no-test-assets. So targets sharing a package can run at once
# without resolving or rebuilding its files under each other. The unit targets remove PG_TEST_URL and friends from
# their environment, so their Postgres-gated files skip even where a server is
# configured; the postgres and throughput targets run those files.
#
# Targets that shard, split into pieces or may skip call a tools/run-checks.sh
# `target` subcommand (see `tools/run-checks.sh help`): it runs the files in
# parallel pieces, writes one machine-JSON file per piece under the target's
# `results` glob, merges the pieces' lcov into the target's `coverage` file,
# and prints the pieces' JSON on stdout, one after another, at the end. A
# _test.dart file tagged `timing` (its tests assert a wall-clock bound; see
# event_sourcing/dart_test.yaml) runs in its own invocation without
# --coverage, so the collector's instrumentation cannot slow it past the
# bound; its results are still recorded and credited, and the merged lcov
# simply carries no lines for it. The
# Postgres targets take their servers from PG_TEST_URLS (space-separated, one
# shard each) or PG_TEST_URL, the second server one file compares against from
# PG_TEST_URL_OTHER_SERVER, and a slice of the shard plan from PG_PART=<i>/<n>
# (CI's matrix); with no server given they start throwaway Postgres containers
# (SHARDS of them) and remove them when done.
#
# Groups name what a run is about. A bare `elspais checks --run-tests` runs
# the `default` group: every target, the full verification.

[scanning.test.groups]
unit = "Every package's tests on the Dart VM, without Postgres (its gated files skip)"
web = "event_sourcing's browser-only suite (test/web/) in Chrome"
desktop = "event_sourcing/example's integration test on a Linux desktop build under a virtual display"
postgres = "Every Postgres-gated test file, run against Postgres servers (the throughput guard excluded)"
demos = "The example packages: their unit tests, the example_action_permissions Postgres files and the desktop integration test"
throughput = "The throughput guard: the current tree's Postgres append and ingest throughput against the baseline build's"

[[scanning.test.targets]]
name = "provenance"
groups = ["default", "unit"]
cwd = "provenance"
command = "env -u PG_TEST_URL -u PG_TEST_URLS -u PG_TEST_URL_OTHER_SERVER -u EVS_THROUGHPUT_TEST flutter test --no-pub --machine --coverage --file-reporter=json:$ELSPAIS_TARGET_OUTPUT/machine.jsonl --coverage-path=$ELSPAIS_TARGET_OUTPUT/lcov.info"
reporter = "flutter-machine"
results = "machine.jsonl"
coverage = "lcov.info"
match = "source"
credit_coverage = "verified"

[[scanning.test.targets]]
name = "canonical_json_jcs"
groups = ["default", "unit"]
cwd = "canonical_json_jcs"
command = "env -u PG_TEST_URL -u PG_TEST_URLS -u PG_TEST_URL_OTHER_SERVER -u EVS_THROUGHPUT_TEST flutter test --no-pub --machine --coverage --file-reporter=json:$ELSPAIS_TARGET_OUTPUT/machine.jsonl --coverage-path=$ELSPAIS_TARGET_OUTPUT/lcov.info"
reporter = "flutter-machine"
results = "machine.jsonl"
coverage = "lcov.info"
match = "source"
credit_coverage = "verified"

[[scanning.test.targets]]
