# YAML seed of the role-permission matrix.
#
# Every permission name listed below MUST be declared by a registered Action,
# or by the server bootstrap for its own routes (`delivery.operate`, which the
# operator routes under /demo/delivery/ require); otherwise the seed validator
# rejects the seed and bootstrap returns a FailSafe policy that denies
# everything. The Anon role is intentionally
# absent: TableBackedAuthorizationPolicy denies anonymous principals before
# the matrix is consulted, so granting permissions to an Anon role would be
# dead code.

roles:
  - Admin
  - GreenTeam
  - BlueTeam
grants:
  Admin:
    - users.provision
    - delivery.operate
  GreenTeam:
    - help.ask
    - notes.write.green
    - buttons.press.green
    - buttons.press.red
  BlueTeam:
    - help.ask
    - notes.write.blue
    - buttons.press.blue
    - buttons.press.red
