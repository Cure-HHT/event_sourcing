services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: evs
      POSTGRES_PASSWORD: evs
      POSTGRES_DB: evs_demo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evs -d evs_demo"]
      interval: 2s
      timeout: 2s
      retries: 20
