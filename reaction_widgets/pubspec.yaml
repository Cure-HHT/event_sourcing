name: reaction_widgets
description: >
  Headless Flutter widget primitives for apps built on the `reaction`
  package. Ships builder primitives, imperative listeners, a scope-
  threading InheritedWidget, a permission gate, an error sink, and
  widget-test doubles. NO rendered or styled widgets — apps render their
  own sugar. See `spec/prd-reaction.md` (EVS-PRD-reaction-widget-contract).
version: 0.1.0-dev
publish_to: none

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.7"

dependencies:
  flutter:
    sdk: flutter
  # flutter_test is in main dependencies (not dev_dependencies) because
  # FakeReaction + pumpReactionWidget are SHIPPED test doubles per
  # EVS-PRD-reaction-widget-contract/H. They live in lib/src/testing/
  # and import WidgetTester / pumpEventQueue from flutter_test, so they
  # need flutter_test resolvable from consumer test code without each
  # consumer redeclaring it.
  flutter_test:
    sdk: flutter
  reaction:
    path: ../reaction
  # event_sourcing is a transitive dep through reaction, but lib code
  # here imports its types directly (Update, ActionSubmission,
  # EffectiveAuthorization, Principal, etc.), so it must be declared
  # explicitly per depend_on_referenced_packages.
  event_sourcing:
    path: ../event_sourcing
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^6.0.0
