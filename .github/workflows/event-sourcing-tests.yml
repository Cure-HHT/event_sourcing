# Full test and analyzer gate — every package in the repository, on every PR
# and push to main.
#
# Jobs:
#   flutter_packages — per package (matrix): `flutter analyze --no-pub` at the
#                      default level (infos fatal), then the package's full
#                      `flutter test` suite. Postgres-gated files skip here
#                      (no PG_TEST_URL); conformance-tests.yml runs them
#                      against a Postgres service. Browser-only files under
#                      event_sourcing/test/web/ run in the browser job.
#   dart_packages    — provenance and canonical_json_jcs: `dart analyze` and
#                      `dart test`.
#   browser          — event_sourcing/test/web/ in Chrome (sembast_web on
#                      IndexedDB).
#   desktop_integration — event_sourcing/example's dual-pane integration test
#                      on a Linux desktop build under a virtual display.

name: Event sourcing tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: event-sourcing-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter_packages:
    name: ${{ matrix.package }} analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: event_sourcing
            test_args: --concurrency=1
          - package: event_sourcing/example
            test_args: ''
          - package: event_sourcing/example_action_permissions
            test_args: --concurrency=1
          - package: event_sourcing/example_clinical_scopes
            test_args: ''
          - package: reaction
            test_args: ''
          - package: reaction/example
            test_args: ''
          - package: reaction_widgets
            test_args: ''
          - package: reaction_widgets_testing
            test_args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
      - name: Resolve deps
        run: flutter pub get
        working-directory: ${{ matrix.package }}
      - name: Analyze
        run: flutter analyze --no-pub
        working-directory: ${{ matrix.package }}
      - name: Test (browser-only test/web/ excluded)
        working-directory: ${{ matrix.package }}
        env:
          TEST_ARGS: ${{ matrix.test_args }}
        run: |
          set -euo pipefail
          # Every top-level directory under test/ except web/, plus top-level
          # test files. test/web/ holds @TestOn('browser') files, which the
          # browser job runs.
          mapfile -t targets < <(
            find test -mindepth 1 -maxdepth 1 \
              \( -type d ! -name web \) -o \( -type f -name '*_test.dart' \) |
              sort
          )
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::no test targets found under test/"
            exit 1
          fi
          # shellcheck disable=SC2086 # TEST_ARGS is a flag list
          flutter test $TEST_ARGS "${targets[@]}"

  dart_packages:
    name: ${{ matrix.package }} analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [provenance, canonical_json_jcs]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
      - name: Resolve deps
        run: dart pub get
        working-directory: ${{ matrix.package }}
      - name: Analyze
        run: dart analyze
        working-directory: ${{ matrix.package }}
      - name: Test
        run: dart test
        working-directory: ${{ matrix.package }}

  browser:
    name: event_sourcing browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
      - name: Resolve deps
        run: flutter pub get
        working-directory: event_sourcing
      - name: Browser tests (Chrome)
        run: flutter test --platform chrome test/web/
        working-directory: event_sourcing

  desktop_integration:
    name: event_sourcing/example desktop integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev xvfb
      - name: Resolve deps
        run: flutter pub get
        working-directory: event_sourcing/example
      - name: Dual-pane integration test
        run: xvfb-run flutter test integration_test/dual_pane_test.dart -d linux
        working-directory: event_sourcing/example
