# Tests, analyzers, the Evidence Snapshot and the traceability gate -- every
# package in the repository, on every PR and push to main.
#
# The test suites are the [[scanning.test.targets]] of .elspais.toml; this
# workflow lists no test command. Each job runs its targets through
# `elspais test --targets <group or target>`, which runs them and evaluates no
# check, and uploads each target's folder under .results/: its results, its
# coverage and its Result Fingerprint (.elspais-run.json, a dotfile, hence
# include-hidden-files). The traceability job downloads every job's folders,
# which recreates .results/<target>/ as each job left it, and judges them once.
# The postgres parts write into one folder per target; each part's fingerprint
# replaces the last, and they agree, because every part runs the same commit
# and .elspais.toml skips everything a job writes.
#
# Jobs:
#   pins        -- reads the Flutter version and the Postgres image from
#                 .github/versions.env, for the jobs below.
#   unit        -- per package (matrix): its analyzer (`flutter analyze
#                 --no-pub`, infos fatal; `dart analyze` in pure Dart
#                 packages), then its unit target. Postgres-gated files skip
#                 there (the targets remove PG_TEST_URL).
#   browser     -- the `web` group: event_sourcing/test/web/ in Chrome.
#   desktop     -- the `desktop` group: event_sourcing/example's dual-pane
#                 integration test on a Linux desktop build under a virtual
#                 display.
#   postgres    -- the `postgres` group, cut into PG_PART slices (matrix), each
#                 against its own Postgres service and the second server one
#                 file compares against.
#                 event_sourcing/test/ci/postgres_ci_listing_test.dart fails
#                 when a gated file is not run by a target this job runs,
#                 and the job fails when a gated test skipped for want of
#                 PG_TEST_URL.
#   throughput  -- the `throughput` group: the throughput guard checks out the
#                 baseline commit into a temporary worktree, so it needs the
#                 full history (fetch-depth 0). It is blocking, and its result
#                 is not part of the Evidence Snapshot.
#   traceability -- the gate. It verifies the committed Evidence Snapshot
#                 (test-evidence/) against the `evidence` group's results of
#                 this run, byte for byte, with the facts the snapshot claims
#                 (`tools/run-checks.sh evidence-verify`). It then runs a strict
#                 `elspais checks` that expects the results of every target,
#                 and writes the coverage summary. It fails on any difference,
#                 on any failing check, and when any other job did not succeed.
#
# The required Validation Summary check waits at most 30 minutes for every
# other check, so no job may run longer. The Flutter SDK, the Postgres image
# and elspais are pinned in .github/versions.env, so a new release cannot
# change a run's outcome; bump them there.

name: Event sourcing tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: event-sourcing-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pins:
    name: Tool pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter_version: ${{ steps.read.outputs.flutter_version }}
      postgres_image: ${{ steps.read.outputs.postgres_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/versions.env
          sparse-checkout-cone-mode: false
      - name: Read .github/versions.env
        id: read
        run: |
          . .github/versions.env
          : "${FLUTTER_VERSION:?FLUTTER_VERSION not set in .github/versions.env}"
          : "${POSTGRES_IMAGE:?POSTGRES_IMAGE not set in .github/versions.env}"
          {
            echo "flutter_version=$FLUTTER_VERSION"
            echo "postgres_image=$POSTGRES_IMAGE"
          } >>"$GITHUB_OUTPUT"

  unit:
    name: ${{ matrix.package }} analyze + test
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # package: the package directory. target: its .elspais.toml unit
        # target, which runs there and writes into .results/<target>/.
        include:
          - package: event_sourcing
            target: event_sourcing
          - package: event_sourcing/example
            target: event_sourcing-example
          - package: event_sourcing/example_action_permissions
            target: event_sourcing-example_action_permissions
          - package: event_sourcing/example_clinical_scopes
            target: event_sourcing-example_clinical_scopes
          - package: reaction
            target: reaction
          - package: reaction/example
            target: reaction-example
          - package: reaction_widgets
            target: reaction_widgets
          - package: reaction_widgets_testing
            target: reaction_widgets_testing
          - package: provenance
            target: provenance
          - package: canonical_json_jcs
            target: canonical_json_jcs
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.pins.outputs.flutter_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install elspais (pinned in .github/versions.env)
        run: |
          . .github/versions.env
          python -m pip install "elspais==${ELSPAIS_VERSION}"
      - name: Resolve deps
        working-directory: ${{ matrix.package }}
        run: |
          if grep -q 'sdk: flutter' pubspec.yaml; then
            flutter pub get
          else
            dart pub get
          fi
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: |
          if grep -q 'sdk: flutter' pubspec.yaml; then
            flutter analyze --no-pub
          else
            dart analyze
          fi
      - name: Test (elspais target ${{ matrix.target }})
        env:
          TARGET: ${{ matrix.target }}
        run: elspais test --targets "$TARGET"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-unit-${{ matrix.target }}
          # .elspais.toml pins the artifact's root to the repository root, so
          # the gate job restores every file to its own path.
          path: |
            .elspais.toml
            .results/${{ matrix.target }}/
            .check-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browser:
    name: event_sourcing browser tests
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.pins.outputs.flutter_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install elspais (pinned in .github/versions.env)
        run: |
          . .github/versions.env
          python -m pip install "elspais==${ELSPAIS_VERSION}"
      - name: Resolve deps
        run: flutter pub get
        working-directory: event_sourcing
      - name: Browser tests (elspais group web)
        run: elspais test --targets web
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-web
          path: |
            .elspais.toml
            .results/event_sourcing-web/
            .check-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: event_sourcing/example desktop integration
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.pins.outputs.flutter_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install elspais (pinned in .github/versions.env)
        run: |
          . .github/versions.env
          python -m pip install "elspais==${ELSPAIS_VERSION}"
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev xvfb
      - name: Resolve deps
        run: flutter pub get
        working-directory: event_sourcing/example
      - name: Dual-pane integration test (elspais group desktop)
        run: elspais test --targets desktop
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-desktop
          path: |
            .elspais.toml
            .results/event_sourcing-example-desktop/
            .check-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  postgres:
    name: Postgres suites (part ${{ matrix.part }} of 6)
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # PG_PART slices of one shard plan; the plan is computed the same way
        # in every job, so together the parts run every Postgres-gated file
        # once. Keep the count in PG_PART below in step with this list.
        part: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: ${{ needs.pins.outputs.postgres_image }}
        env:
          POSTGRES_USER: evs
          POSTGRES_PASSWORD: evs
          POSTGRES_DB: evs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evs -d evs_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      # A second server whose database and schema have the same names, for
      # the check that a lock session reaches the pool's server.
      postgres_other:
        image: ${{ needs.pins.outputs.postgres_image }}
        env:
          POSTGRES_USER: evs
          POSTGRES_PASSWORD: evs
          POSTGRES_DB: evs_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U evs -d evs_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      PG_TEST_URL: postgres://evs:evs@localhost:5432/evs_test
      PG_TEST_URL_OTHER_SERVER: postgres://evs:evs@localhost:5433/evs_test
      PG_PART: ${{ matrix.part }}/6
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.pins.outputs.flutter_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install elspais (pinned in .github/versions.env)
        run: |
          . .github/versions.env
          python -m pip install "elspais==${ELSPAIS_VERSION}"
      - name: Resolve deps (event_sourcing)
        run: flutter pub get
        working-directory: event_sourcing
      - name: Resolve deps (example_action_permissions)
        run: flutter pub get
        working-directory: event_sourcing/example_action_permissions
      - name: Postgres-gated files (elspais group postgres)
        run: elspais test --targets postgres
      # A gated test that finds no server skips itself with a reason naming
      # PG_TEST_URL (a shared harness says "no database for ..."). Here a
      # server is configured, so a skip means a file ran without it.
      - name: No Postgres-gated test skipped
        run: |
          targets=".results/event_sourcing-postgres .results/event_sourcing-example_action_permissions-postgres"
          results=""
          for dir in $targets; do
            if [ -d "$dir" ]; then results="$results $dir"; fi
          done
          if [ -z "$results" ] || [ -z "$(find $results -name '*.jsonl' -print -quit)" ]; then
            echo "::error::no Postgres test results under $targets"
            exit 1
          fi
          pattern='PG_TEST_URL( is)? (unset|not set)|no (database|backend available) for '
          if grep -rEl --include='*.jsonl' "$pattern" $results; then
            echo "::error::Postgres-gated tests skipped although PG_TEST_URL is set:"
            grep -rhoE --include='*.jsonl' '"messageType":"skip","message":"[^"]*"' $results | sort | uniq -c
            exit 1
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-postgres-${{ matrix.part }}
          path: |
            .elspais.toml
            .results/event_sourcing-postgres/
            .results/event_sourcing-example_action_permissions-postgres/
            .check-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  throughput:
    name: Postgres throughput guard against the baseline build
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ needs.pins.outputs.postgres_image }}
        env:
          POSTGRES_USER: evs
          POSTGRES_PASSWORD: evs
          POSTGRES_DB: evs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evs -d evs_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      PG_TEST_URL: postgres://evs:evs@localhost:5432/evs_test
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline worktree checks out a commit from the tree's own
          # history, so the full history must be present.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.pins.outputs.flutter_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install elspais (pinned in .github/versions.env)
        run: |
          . .github/versions.env
          python -m pip install "elspais==${ELSPAIS_VERSION}"
      - name: Resolve deps (canonical_json_jcs)
        run: flutter pub get
        working-directory: canonical_json_jcs
      - name: Resolve deps (provenance)
        run: flutter pub get
        working-directory: provenance
      - name: Resolve deps (event_sourcing)
        run: flutter pub get
        working-directory: event_sourcing
      - name: Throughput guard (elspais group throughput)
        run: elspais test --targets throughput
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-throughput
          path: |
            .elspais.toml
            .results/event_sourcing-throughput/
            .check-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  traceability:
    name: Traceability gate (Evidence Snapshot and elspais checks)
    needs: [pins, unit, browser, desktop, postgres, throughput]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install elspais (pinned in .github/versions.env)
        run: |
          . .github/versions.env
          python -m pip install "elspais==${ELSPAIS_VERSION}"
      # merge-multiple restores every file to its own path, so each target's
      # folder, fingerprint included, is .results/<target>/ again.
      - name: Download every job's results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: .
      - name: Merge the coverage of each target's pieces and shards
        run: tools/run-checks.sh merge-coverage
      # `elspais evidence verify --targets evidence` with the facts the
      # snapshot claims, read from .github/versions.env: a difference in any
      # outcome, result, fact, target, tree digest or report fails the step.
      - name: The committed Evidence Snapshot describes this run
        run: tools/run-checks.sh evidence-verify
      # --spec-dir (the configured one) builds the graph in this process
      # rather than through a daemon, which does not watch the results files.
      # Strict: any warning fails it. --expect names every target, so a target
      # with no results is a fault rather than one not run.
      - name: elspais checks (strict, every target expected)
        if: always()
        run: elspais --spec-dir spec checks --expect evidence throughput
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Traceability coverage'
            echo
            elspais --spec-dir spec summary --format markdown
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Every test job succeeded
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          print(" ".join(k + "=" + v["result"] for k, v in needs.items() if v["result"] != "success"))
          ')"
          if [ -n "$failed" ]; then
            echo "::error::jobs that did not succeed: $failed"
            exit 1
          fi
