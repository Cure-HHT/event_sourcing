# Security - Check for Secrets — emits a check named exactly
# "Security - Check for Secrets" to satisfy the org-level
# branch-protection ruleset on every Cure-HHT repo.
#
# CANONICAL HOME: cure-hht/hht_admin (this file).
# Consumer repos copy this file as-is into their own
# .github/workflows/. Gitleaks version is pinned in
# .github/versions.env (also copied alongside).

name: Security - Check for Secrets

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Security - Check for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Load version configuration
        id: versions
        run: |
          source .github/versions.env
          echo "gitleaks_version=${GITLEAKS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ steps.versions.outputs.gitleaks_version }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"; then
              break
            fi
            echo "Download attempt $i failed, retrying..."
            sleep 5
          done
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo mv gitleaks /usr/local/bin/
          rm "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gitleaks version

      - name: Scan for secrets
        run: |
          set -euo pipefail
          if gitleaks detect --verbose --no-banner --redact --log-level info; then
            echo "No secrets detected"
          else
            echo "::error::Gitleaks detected secrets in the repository"
            echo "Remove all secrets before merging. Use Doppler / env vars."
            exit 1
          fi
