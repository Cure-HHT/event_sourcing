name: reaction_example
description: Reaction client/server demo — Flutter Linux desktop client + shelf server.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.7"

dependencies:
  flutter:
    sdk: flutter
  event_sourcing:
    path: ../../event_sourcing
  reaction:
    path: ../
  reaction_widgets:
    path: ../../reaction_widgets
  http: ^1.4.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  sembast: ^3.7.1
  uuid: ^4.5.1
  args: ^2.5.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  reaction_widgets_testing:
    path: ../../reaction_widgets_testing
  flutter_lints: ^6.0.0

flutter:
  # Bundles the MaterialIcons font. Without this the build ships an empty
  # FontManifest and every Material icon renders as a "tofu" box — the
  # actual cause of the missing dropdown chevrons (not icon tree-shaking).
  uses-material-design: true
