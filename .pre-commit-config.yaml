# Pre-commit hooks for cure-hht/event_sourcing.
#
# Hook list mirrors cure-hht/hht_workflows (the canonical home for
# Cure-HHT shared hook discipline) plus Dart-specific local hooks.
#
# Setup:
#   scripts/setup.sh      # configures core.hooksPath and warms cache
#
# Manual run:
#   pre-commit run --all-files

default_stages: [pre-commit]

repos:
  # Universal hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # trailing-whitespace and end-of-file-fixer open each file read-write
      # ('rb+') even just to verify it, so they crash on elspais's generated
      # artifacts, which `elspais fix` writes read-only (0444). Those files are
      # generated — they must not be hand-normalized by these hooks anyway — so
      # exclude them. (The read-only bit is only a local "don't edit" nudge:
      # git doesn't track it, so it doesn't survive a fresh checkout; the
      # exclude is the portable guard.)
      - id: trailing-whitespace
        exclude: '^spec/(INDEX\.md$|_generated/)'
      - id: end-of-file-fixer
        exclude: '^spec/(INDEX\.md$|_generated/)'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  # Cure-HHT cross-cutting hooks — shared house rules enforced across repos.
  # Implements: HHT-OPS-confidential-keywords-scrubbing/H,I
  - repo: https://github.com/Cure-HHT/hht_workflows
    rev: v1.6.0
    hooks:
      - id: no-or-true-guard
      # Confidential-terms guard, pre-push surface: scans added content,
      # file/directory names, and the branch name against the prohibit
      # list fetched via the developer's own doppler login.
      # --on-fetch-error=warn: a dev without scan-event-sourcing read
      # access gets a loud warning and CI (confidential-terms-scan.yml)
      # stays the authoritative gate. Report locations are masked; matched
      # text is never printed.
      - id: confidential-terms-scan
        args: [--doppler-project=scan-event-sourcing, --on-fetch-error=warn]

  # Secret scanning — same gitleaks version pinned in the org's CI.
  # Runs at both pre-commit (catch secrets while editing) and pre-push
  # (last line of defence before they reach the remote).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  # Markdown linting — REQ specs and READMEs.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--ignore, .github/]

  # Dart formatting — local hook (no public pre-commit-hooks repo).
  # Runs `dart format --set-exit-if-changed` against staged Dart files;
  # fails the commit if any file is unformatted.
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format --output=none --set-exit-if-changed
        language: system
        types: [dart]
        # Excludes generated files; if any package adds .g.dart later, list it here.

  # elspais checks — requirements-traceability validation. Runs at
  # pre-push only (the full graph scan is too slow for pre-commit).
  # `--lenient` exits 0 on warnings (e.g., unlinked files, coverage
  # gaps) but non-zero on hard errors (broken references, format
  # violations, retired-ref citations). Treat the warnings as a
  # backlog: opportunistic annotation work tightens the surface
  # without blocking unrelated pushes.
  - repo: local
    hooks:
      # Sole elspais version pin lives in .github/versions.env; this gate fails
      # the push if the installed elspais is older (keeps local in sync with the
      # config's `match = "source"` expectations). Runs before elspais-checks.
      - id: elspais-version
        name: elspais version pin
        entry: scripts/check-elspais-version.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: elspais-checks
        name: elspais checks
        entry: elspais checks --lenient
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
